name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust 必须在 Windows 上跑：
  # src-tauri 通过 `[target.'cfg(windows)'.dependencies]` 引入 windows crate，
  # 且窗口层代码没有为非 Windows 平台留任何分支，换平台连编译都过不去。
  rust:
    name: Rust / ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            dir: apps/desktop/src-tauri
          - name: ai-core
            dir: packages/ai-core
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}

      - name: 格式
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: 编译检查
        run: cargo check --all-targets

  web:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本取自根 package.json 的 packageManager 字段，不在 CI 里重复声明
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建
        run: pnpm build

# 暂不纳入 CI（M1 之后按需补齐）：
#   - tauri build：产物打包与签名依赖证书，且耗时数分钟，留到出发布流程时再做
#   - pnpm validate:characters：assets/characters 目前只有 .gitkeep，没有可校验的角色包
#   - 端到端窗口层验证：透明 / 穿透 / 拖拽 / DPI 依赖真实桌面会话，GitHub Runner 上无意义
