[package]
name = "heart-star"
version = "0.1.0"
description = "Heart Star - AI Desktop Pet"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘图标。桌宠无边框、不进任务栏、面板默认隐藏，
# 托盘是唯一常驻的可发现入口，没有它用户关掉面板后找不到任何 UI。
# image-ico / image-png：让 default_window_icon() 能解出图标给托盘复用。
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Win32：透明窗口、鼠标穿透、宿主迁移、DPI 全靠它。
# 版本必须与 tauri 内部依赖的 windows 对齐（当前 0.62），
# 否则 `WebviewWindow::hwnd()` 返回的 HWND 与本 crate 的 HWND 是两个不同类型。
# features 按需增删，不要开全量，编译极慢。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
] }

[features]
# 自定义协议 / 插件等后续开启
default = []
